<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Retro</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #12121f;
        --panel: #1c1c30;
        --panel-2: #26263e;
        --text: #ecece4;
        --muted: #8a8aa3;
        --accent: #ffb830;
        --danger: #ff5252;
        --ok: #4cd964;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--panel-2);
        border: 2px solid #3a3a5c;
        border-radius: 10px;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
        transition: transform 0.06s, background 0.15s, border-color 0.15s;
      }
      button:hover { background: #30304e; border-color: #52527a; }
      button:active { transform: scale(0.97); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #211a00; font-weight: 700; }
      button.primary:hover { background: #ffc85c; }
      select {
        font: inherit; color: inherit; background: var(--panel-2);
        border: 2px solid #3a3a5c; border-radius: 8px; padding: 0.3rem 0.5rem;
      }
      .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
      [hidden] { display: none !important; }
      .sprite { image-rendering: pixelated; }
      .hint { color: var(--muted); font-size: 0.78rem; line-height: 1.35; }

      /* ---------------------------------------------------------- intro */
      #screen-intro {
        align-items: center; text-align: center;
        /* "safe" keeps the top reachable when the content overflows a short
           window — otherwise the "Criar sala" card gets clipped away. */
        justify-content: center; justify-content: safe center;
        overflow-y: auto;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(255, 184, 48, 0.06), transparent 55%),
          #080c17;
        gap: 1.4rem; padding: 1rem;
      }
      .intro-kicker {
        color: #6fc3ff; letter-spacing: 0.35em; text-transform: uppercase;
        font-size: 0.72rem;
      }
      .intro-title {
        font-size: clamp(2.6rem, 8vw, 5rem);
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.05;
        background: linear-gradient(180deg, #ffe08a 0%, var(--accent) 55%, #ff8c42 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: title-glow 2.6s ease-in-out infinite;
      }
      @keyframes title-glow {
        0%, 100% { filter: drop-shadow(0 0 18px rgba(255, 184, 48, 0.25)); }
        50% { filter: drop-shadow(0 0 34px rgba(255, 184, 48, 0.5)); }
      }
      .intro-sub {
        font-size: clamp(1rem, 3vw, 1.5rem);
        letter-spacing: 0.5em; text-transform: uppercase; color: var(--text);
        margin-top: -0.4rem;
      }
      .select-title { font-size: clamp(2rem, 6vw, 3.4rem); }
      #game-select {
        display: flex; gap: 1.4rem; flex-wrap: wrap; justify-content: center;
        margin-top: 0.4rem;
      }
      button.game-card {
        width: min(370px, 84vw);
        padding: 0; text-align: center; position: relative;
        background: rgba(11, 17, 34, 0.8);
        border: 1px solid #2b3a63; border-radius: 8px;
        display: flex; flex-direction: column;
        transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s;
      }
      button.game-card:hover {
        transform: translateY(-4px); border-color: var(--accent);
        box-shadow: 0 14px 44px rgba(255, 184, 48, 0.18);
        background: rgba(11, 17, 34, 0.8);
      }
      /* HUD corner brackets — amber on hover (the bridge to the lobby style) */
      .game-card::before, .game-card::after, .game-card .corner {
        content: ''; position: absolute; width: 18px; height: 18px;
        border: 2px solid #66b8ff; pointer-events: none; z-index: 2;
        transition: border-color 0.15s;
      }
      .game-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
      .game-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
      .game-card .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
      .game-card .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
      .game-card:hover::before, .game-card:hover::after,
      .game-card:hover .corner { border-color: var(--accent); }
      .game-cover {
        position: relative; display: flex; align-items: center; justify-content: center;
        aspect-ratio: 16 / 10; width: 100%;
        border-radius: 7px 7px 0 0; overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 80%, rgba(255, 184, 48, 0.12), transparent 60%),
          linear-gradient(180deg, #0d1531, #14203e);
      }
      .game-cover-fallback { font-size: 4.2rem; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }
      .game-cover img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; image-rendering: pixelated;
      }
      .game-name {
        font-weight: 800; font-size: 1.05rem; padding: 0.75rem 0 0.15rem;
        letter-spacing: 0.16em; text-transform: uppercase;
      }
      .game-desc { color: var(--muted); font-size: 0.72rem; padding: 0 1rem 0.85rem; line-height: 1.45; }
      .intro-join { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.2rem; }
      .intro-join .hint {
        color: #6fc3ff; letter-spacing: 0.22em; text-transform: uppercase;
        font-size: 0.66rem;
      }
      #inp-code {
        font: inherit; color: inherit; background: rgba(11, 17, 34, 0.8);
        border: 1px solid #2b3a63; border-radius: 8px;
        width: 7.5ch; padding: 0.45rem 0.4rem; text-align: center;
        font-size: 1.15rem; font-weight: 800; letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      #inp-code:focus { outline: none; border-color: var(--accent); }
      #intro-status { min-height: 1.1em; }

      /* ------------------------- visual "terminal arcade" (título + lobby) */
      .tron {
        background: #080c17;
        font-family: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
      }
      /* content above the fixed grid pseudo-elements */
      .tron > * { position: relative; z-index: 1; }
      /* tron floor + ceiling grids */
      .tron::before, .tron::after {
        content: ''; position: fixed; left: -25%; right: -25%; height: 72%;
        background-image:
          linear-gradient(rgba(96, 150, 255, 0.15) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(96, 150, 255, 0.15) 1.5px, transparent 1.5px);
        background-size: 76px 76px;
        pointer-events: none;
      }
      .tron::before {
        bottom: -6%;
        transform: perspective(480px) rotateX(58deg);
        transform-origin: 50% 100%;
        -webkit-mask-image: linear-gradient(to top, black 30%, transparent);
        mask-image: linear-gradient(to top, black 30%, transparent);
      }
      .tron::after {
        top: -6%; opacity: 0.5;
        transform: perspective(480px) rotateX(-58deg);
        transform-origin: 50% 0%;
        -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent);
        mask-image: linear-gradient(to bottom, black 30%, transparent);
      }
      .tron button {
        font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em;
        font-weight: 700; font-size: 0.82rem; border-radius: 8px;
      }
      .tron select { font-family: inherit; }

      /* ------------------------------------------ lobby (terminal arcade) */
      #screen-lobby {
        align-items: center; justify-content: center; justify-content: safe center;
        overflow-y: auto; padding: 1.2rem;
      }
      #lobby-layout {
        position: relative; z-index: 1;
        display: flex; gap: 2.2rem; align-items: center; justify-content: center;
        flex-wrap: wrap;
        /* explicit width: intrinsic sizing of wrap containers under-measures
           shrinkable items and wraps even with room to spare */
        width: min(990px, 100%);
      }
      #lobby-panel {
        position: relative;
        width: min(620px, 94vw);
        background: rgba(11, 17, 34, 0.8);
        border: 1px solid rgba(102, 184, 255, 0.22);
        padding: 1.5rem 1.8rem 1.4rem;
        display: flex; flex-direction: column; gap: 0.95rem;
      }
      /* HUD corner brackets */
      #lobby-panel::before, #lobby-panel::after, #lobby-panel .corner {
        content: ''; position: absolute; width: 26px; height: 26px;
        border: 2px solid #66b8ff; pointer-events: none;
      }
      #lobby-panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
      #lobby-panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
      #lobby-panel .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
      #lobby-panel .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
      #screen-lobby header { text-align: center; }
      #lobby-room {
        font-size: 1.3rem; font-weight: 700; letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      #lobby-room strong {
        color: #ffd23f; font-size: 1.7rem; letter-spacing: 0.3em; margin-left: 0.2em;
        text-shadow: 0 0 16px rgba(255, 210, 63, 0.6);
      }
      #lobby-status { color: #55607e; margin-top: 0.35rem; font-size: 0.7rem; }
      #char-grid {
        display: grid; grid-template-columns: repeat(4, minmax(96px, 1fr));
        gap: 0.6rem;
      }
      .char-card {
        background: #0d1531;
        border: 1px solid #2b3a63;
        border-radius: 8px;
        padding: 0.5rem 0.3rem 0.4rem;
        text-align: center;
        cursor: pointer;
        position: relative;
        transition: transform 0.08s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
      }
      .char-card:hover { transform: translateY(-2px); border-color: #66b8ff; }
      .char-card img, .char-card canvas { width: 56px; height: 56px; object-fit: contain; }
      .char-card .char-name { font-weight: 700; margin-top: 0.2rem; font-size: 0.72rem; letter-spacing: 0.05em; }
      .char-card .char-ability-icon { position: absolute; top: 4px; left: 6px; font-size: 0.8rem; }
      .char-card.preview { border-color: #66b8ff; box-shadow: 0 0 10px rgba(102, 184, 255, 0.35); }
      .char-card.taken:not(.mine) { opacity: 0.4; }
      .char-card.mine {
        border-color: #ffd23f; background: #17203e;
        box-shadow: 0 0 12px rgba(255, 210, 63, 0.4);
      }
      .char-card .char-tag {
        position: absolute; top: 3px; right: 5px; font-size: 0.6rem;
        background: rgba(0, 0, 0, 0.45); border-radius: 5px; padding: 1px 5px; color: var(--muted);
      }

      /* the chosen one — floats big over the grid, outside the panel */
      #char-preview {
        position: relative; z-index: 1;
        flex: 0 0 330px;
        display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
      }
      #preview-stage {
        position: relative; width: 100%; height: 300px;
        display: flex; align-items: flex-end; justify-content: center;
        background: radial-gradient(ellipse at 50% 68%, var(--preview-glow, rgba(120, 170, 255, 0.1)), transparent 65%);
      }
      #preview-stage::after {
        content: ''; position: absolute; bottom: 8px; left: 50%;
        width: 150px; height: 24px; transform: translateX(-50%);
        background: radial-gradient(ellipse, rgba(0, 0, 0, 0.6), transparent 70%);
      }
      #preview-sprite {
        height: 270px; width: 270px; object-fit: contain; z-index: 1;
        margin-bottom: 12px;
        filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.55));
        animation: preview-bob 1.6s ease-in-out infinite;
      }
      @keyframes preview-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      #preview-name {
        font-size: 1.65rem; font-weight: 800; letter-spacing: 0.32em;
        text-transform: uppercase; text-align: center; padding-left: 0.32em;
        text-shadow: 0 0 18px rgba(111, 195, 255, 0.35);
      }
      #preview-status { font-size: 0.72rem; color: var(--muted); margin-top: -0.3rem; letter-spacing: 0.1em; }
      #preview-ability {
        width: 100%; background: rgba(13, 21, 49, 0.85);
        border: 1px solid #2b3a63; border-radius: 8px;
        padding: 0.5rem 0.7rem; display: flex; gap: 0.6rem; align-items: center;
      }
      #preview-ability .ab-icon { font-size: 1.4rem; }
      #preview-ability .ab-name { font-weight: 700; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
      #preview-ability .ab-desc { color: var(--muted); font-size: 0.72rem; line-height: 1.35; }
      #btn-pick { width: 100%; font-size: 0.95rem; }

      #lobby-bottom { display: flex; flex-direction: column; gap: 0.8rem; }
      #player-list {
        display: flex; flex-direction: column; gap: 0.3rem;
        border-top: 1px solid rgba(102, 184, 255, 0.15);
        border-bottom: 1px solid rgba(102, 184, 255, 0.15);
        padding: 0.55rem 0.2rem;
      }
      .player-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
      .player-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .player-row .who { color: var(--muted); font-size: 0.68rem; margin-left: auto; letter-spacing: 0.08em; }
      #lobby-controls {
        display: flex; flex-wrap: wrap; gap: 0.6rem;
        align-items: center; justify-content: center;
      }
      #lobby-hint { text-align: center; min-height: 1em; }
      /* command + scoring guides — two cards below the panel, company for
         the wait; they stack when the window is narrow */
      #lobby-guides {
        display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: stretch;
        justify-content: center; margin-top: 1.4rem;
      }
      .guide-card {
        color: var(--muted); font-size: 0.7rem;
        padding: 0.6rem 1.1rem 0.65rem;
        background: rgba(11, 17, 34, 0.7);
        border: 1px solid rgba(102, 184, 255, 0.15); border-radius: 8px;
      }
      .guide-card .guide-title {
        color: #6fc3ff; letter-spacing: 0.22em; text-transform: uppercase;
        font-size: 0.62rem; margin-bottom: 0.5rem;
      }
      .guide-card .guide-row {
        display: flex; align-items: center; gap: 0.5rem; padding: 0.14rem 0;
      }
      .guide-card .keys { display: flex; gap: 0.25rem; }
      .guide-card .kbd {
        border: 1px solid #2b3a63; border-bottom-width: 2px; border-radius: 5px;
        background: #0d1531; color: #b8c6e8;
        padding: 2px 7px; font-size: 0.68rem; letter-spacing: 0.05em;
      }
      #score-guide strong { color: #b8c6e8; }
      #host-controls { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; justify-content: center; }
      #host-controls .row { display: flex; gap: 0.5rem; align-items: center; }
      #host-controls label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
      #btn-start {
        background: linear-gradient(180deg, #ff9a3d, #e14e2a);
        border-color: #ff9a3d; color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      #btn-start:hover { background: linear-gradient(180deg, #ffab55, #ef5c37); border-color: #ffab55; }
      #btn-leave { background: #7e1f2b; border-color: #c53a48; color: #ffd9d9; }
      #btn-leave:hover { background: #9c2735; border-color: #e05464; }

      /* ----------------------------------------------------------- game */
      #screen-game { align-items: center; justify-content: center; background: #0d0d17; }
      #game-layout { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100vw; }
      #hud-top, #hud-bottom {
        display: flex; align-items: center; gap: 1rem;
        width: 100%; padding: 0.3rem 0.4rem; font-size: 0.9rem;
      }
      #hud-top { justify-content: space-between; }
      #hud-players { display: flex; gap: 0.55rem; flex-wrap: wrap; justify-content: center; }
      .hud-chip { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; }
      .hud-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
      .hud-chip.dead { opacity: 0.45; text-decoration: line-through; }
      #hud-round { font-weight: 700; }
      #hud-sudden { color: var(--muted); font-variant-numeric: tabular-nums; }
      #hud-sudden.warn { color: var(--danger); font-weight: 700; }
      canvas#game-canvas { border-radius: 10px; box-shadow: 0 0 0 2px #2c2c46, 0 18px 60px rgba(0,0,0,0.5); }
      #hud-bottom { justify-content: space-between; }
      #hud-stats { display: flex; gap: 0.9rem; font-variant-numeric: tabular-nums; }
      #hud-ability { display: flex; align-items: center; gap: 0.5rem; min-width: 220px; }
      #ability-bar { position: relative; flex: 1; height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
      #ability-fill { position: absolute; inset: 0; width: 100%; background: var(--ok); transition: width 0.1s linear; }
      #ability-bar.cooling #ability-fill { background: #5a5a86; }
      #hud-keys { color: var(--muted); font-size: 0.75rem; }

      /* -------------------------------------------------------- overlays */
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(10, 10, 20, 0.72); backdrop-filter: blur(3px); z-index: 20;
      }
      #overlay .panel {
        background: var(--panel); border: 2px solid #32324e; border-radius: 18px;
        padding: 1.6rem 2rem; min-width: min(560px, 92vw); max-height: 86vh; overflow-y: auto;
        text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      }
      #overlay h2 { margin-bottom: 0.9rem; }
      #overlay.countdown { background: transparent; backdrop-filter: none; pointer-events: none; }
      #overlay.countdown .panel { background: transparent; border: none; box-shadow: none; }
      .countdown-num {
        font-size: 7rem; font-weight: 800; color: var(--accent);
        text-shadow: 0 6px 30px rgba(255, 184, 48, 0.55); font-variant-numeric: tabular-nums;
      }
      table.score { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
      table.score th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
      table.score th, table.score td { padding: 0.42rem 0.5rem; text-align: left; border-bottom: 1px solid #2c2c46; }
      table.score td.num, table.score th.num { text-align: right; font-variant-numeric: tabular-nums; }
      table.score .delta { color: var(--ok); font-size: 0.8rem; }
      table.score tr.last-place td { background: rgba(255, 82, 82, 0.08); }
      .row-name { display: flex; align-items: center; gap: 0.45rem; }
      .row-name .dot { width: 11px; height: 11px; border-radius: 50%; }
      .medal { width: 1.4em; display: inline-block; }
      .podium-loser {
        margin-top: 1rem; padding: 0.7rem 1rem; border-radius: 12px;
        background: rgba(255, 82, 82, 0.12); border: 1px solid rgba(255, 82, 82, 0.4);
        font-weight: 600;
      }
      .overlay-sub { color: var(--muted); margin-top: 0.8rem; font-size: 0.9rem; }
      #overlay .actions { margin-top: 1.1rem; display: flex; gap: 0.7rem; justify-content: center; }

      /* ---------------------------------------------------------- volume */
      #sound-control {
        position: fixed; right: 16px; bottom: 16px; z-index: 60;
        display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      }
      #btn-mute {
        width: 44px; height: 44px; padding: 0; border-radius: 50%;
        font-size: 1.15rem; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        background: rgba(28, 28, 48, 0.85); border-color: #454570;
        opacity: 0.75;
      }
      #btn-mute:hover { opacity: 1; }
      #volume-popover {
        background: rgba(11, 17, 34, 0.92);
        border: 1px solid rgba(102, 184, 255, 0.25); border-radius: 8px;
        padding: 0.65rem 0.8rem;
      }
      #volume-slider {
        display: block; width: 150px; accent-color: var(--accent); cursor: pointer;
      }

      /* ---------------------------------------------------------- toasts */
      #toasts {
        position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 0.5rem; z-index: 50; align-items: center;
      }
      .toast {
        background: var(--panel-2); border: 1px solid #454570; color: var(--text);
        border-radius: 10px; padding: 0.5rem 1rem; font-size: 0.9rem;
        animation: toast-in 0.18s ease-out; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      }
      @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }

      #dead-banner {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(28, 28, 48, 0.9); border: 1px solid #454570; border-radius: 10px;
        padding: 0.4rem 1rem; font-size: 0.9rem; z-index: 15;
      }
    </style>
  </head>
  <body>
    <div id="screen-intro" class="screen tron">
      <p class="intro-kicker">jogo da retro · o ritual sagrado</p>
      <h1 class="intro-title select-title">Escolha o jogo</h1>
      <div id="game-select">
        <button class="game-card" id="btn-create-bomber">
          <i class="corner tr"></i><i class="corner bl"></i>
          <span class="game-cover">
            <span class="game-cover-fallback">💣</span>
            <img src="/capas/bomber.png" alt="" />
          </span>
          <span class="game-name">Bomber Royale</span>
          <span class="game-desc"></span>
        </button>
        <button class="game-card" id="btn-create-batata">
          <i class="corner tr"></i><i class="corner bl"></i>
          <span class="game-cover">
            <span class="game-cover-fallback">🥔</span>
            <img src="/capas/batata.png" alt="" />
          </span>
          <span class="game-name">Batata-Quente</span>
          <span class="game-desc"></span>
        </button>
      </div>
      <div class="intro-join">
        <span class="hint">já tem um código?</span>
        <input id="inp-code" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false" />
        <button id="btn-join">▶ Entrar</button>
      </div>
      <p class="hint" id="intro-status"></p>
    </div>

    <div id="screen-lobby" class="screen tron" hidden>
      <div id="lobby-layout">
        <div id="lobby-panel">
          <i class="corner tr"></i><i class="corner bl"></i>
          <header>
            <h1 id="lobby-room">sala: <strong>····</strong></h1>
            <p id="lobby-status">conectando…</p>
          </header>
          <div id="char-grid"></div>
          <div id="lobby-bottom">
            <div id="player-list"></div>
            <div id="lobby-controls">
              <div id="host-controls" hidden>
                <div class="row">
                  <label for="sel-rounds">Rodadas</label>
                  <select id="sel-rounds"></select>
                  <button id="btn-add-bot" title="Bot preenche a sala e joga sozinho">🤖 + bot</button>
                </div>
                <button id="btn-start" class="primary">▶ Iniciar partida</button>
              </div>
              <button id="btn-leave" title="Voltar para a tela inicial">Sair</button>
            </div>
            <p class="hint" id="lobby-hint"></p>
          </div>
        </div>
        <aside id="char-preview">
          <div id="preview-stage">
            <img id="preview-sprite" class="sprite" alt="" />
          </div>
          <div id="preview-name"></div>
          <div id="preview-status"></div>
          <div id="preview-ability">
            <span class="ab-icon"></span>
            <div>
              <div class="ab-name"></div>
              <div class="ab-desc"></div>
            </div>
          </div>
          <button id="btn-pick" class="primary"></button>
        </aside>
      </div>
      <div id="lobby-guides">
        <div class="guide-card" id="lobby-guide"></div>
        <div class="guide-card" id="score-guide"></div>
      </div>
    </div>

    <div id="screen-game" class="screen" hidden>
      <div id="game-layout">
        <div id="hud-top">
          <span id="hud-round"></span>
          <div id="hud-players"></div>
          <span id="hud-sudden"></span>
        </div>
        <canvas id="game-canvas" width="850" height="650"></canvas>
        <div id="hud-bottom">
          <div id="hud-stats"></div>
          <div id="hud-ability">
            <span id="ability-label"></span>
            <div id="ability-bar"><div id="ability-fill"></div></div>
          </div>
          <span id="hud-keys">espaço: bomba · shift/E: habilidade</span>
        </div>
      </div>
      <div id="dead-banner" hidden></div>
    </div>

    <div id="overlay" hidden><div class="panel" id="overlay-panel"></div></div>
    <div id="sound-control">
      <div id="volume-popover" hidden>
        <input id="volume-slider" type="range" min="0" max="100" step="5" aria-label="Volume da música e efeitos" />
      </div>
      <button id="btn-mute">🔊</button>
    </div>
    <div id="toasts"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
