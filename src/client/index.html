<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Retro</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #12121f;
        --panel: #1c1c30;
        --panel-2: #26263e;
        --text: #ecece4;
        --muted: #8a8aa3;
        --accent: #ffb830;
        --danger: #ff5252;
        --ok: #4cd964;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--panel-2);
        border: 2px solid #3a3a5c;
        border-radius: 10px;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
        transition: transform 0.06s, background 0.15s, border-color 0.15s;
      }
      button:hover { background: #30304e; border-color: #52527a; }
      button:active { transform: scale(0.97); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #211a00; font-weight: 700; }
      button.primary:hover { background: #ffc85c; }
      select {
        font: inherit; color: inherit; background: var(--panel-2);
        border: 2px solid #3a3a5c; border-radius: 8px; padding: 0.3rem 0.5rem;
      }
      .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
      [hidden] { display: none !important; }
      .sprite { image-rendering: pixelated; }
      .hint { color: var(--muted); font-size: 0.78rem; line-height: 1.35; }

      /* ---------------------------------------------------------- intro */
      #screen-intro {
        align-items: center; justify-content: center; text-align: center;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(255, 184, 48, 0.07), transparent 55%),
          var(--bg);
        gap: 1.4rem; padding: 1rem;
      }
      .intro-kicker {
        color: var(--muted); letter-spacing: 0.35em; text-transform: uppercase;
        font-size: 0.78rem;
      }
      .intro-title {
        font-size: clamp(2.6rem, 8vw, 5rem);
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.05;
        background: linear-gradient(180deg, #ffe08a 0%, var(--accent) 55%, #ff8c42 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: title-glow 2.6s ease-in-out infinite;
      }
      @keyframes title-glow {
        0%, 100% { filter: drop-shadow(0 0 18px rgba(255, 184, 48, 0.25)); }
        50% { filter: drop-shadow(0 0 34px rgba(255, 184, 48, 0.5)); }
      }
      .intro-sub {
        font-size: clamp(1rem, 3vw, 1.5rem);
        letter-spacing: 0.5em; text-transform: uppercase; color: var(--text);
        margin-top: -0.4rem;
      }
      .intro-tagline { color: var(--muted); font-size: 0.95rem; }
      #intro-roster { display: flex; gap: 0.9rem; margin: 0.6rem 0 0.4rem; flex-wrap: wrap; justify-content: center; }
      #intro-roster img {
        width: 64px; height: 64px; object-fit: contain;
        animation: roster-bob 1.4s ease-in-out infinite;
      }
      @keyframes roster-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      #btn-enter { font-size: 1.25rem; padding: 0.8rem 3.2rem; border-radius: 14px; }
      #intro-status { min-height: 1.1em; }

      /* ---------------------------------------------------------- lobby */
      #screen-lobby { align-items: center; overflow-y: auto; padding: 1.1rem; gap: 0.9rem; }
      #screen-lobby header { text-align: center; }
      #screen-lobby h1 { font-size: 1.45rem; letter-spacing: 0.02em; }
      #lobby-status { color: var(--muted); margin-top: 0.15rem; font-size: 0.88rem; }
      #lobby-main {
        display: flex; gap: 1rem; width: min(980px, 100%);
        align-items: stretch; flex-wrap: wrap; justify-content: center;
      }
      #char-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(104px, 1fr));
        gap: 0.65rem;
        flex: 1 1 440px;
        align-content: start;
      }
      .char-card {
        background: var(--panel);
        border: 2px solid #32324e;
        border-radius: 12px;
        padding: 0.5rem 0.3rem 0.45rem;
        text-align: center;
        cursor: pointer;
        position: relative;
        transition: transform 0.08s, border-color 0.15s, box-shadow 0.15s;
      }
      .char-card:hover { transform: translateY(-2px); border-color: #52527a; }
      .char-card img, .char-card canvas { width: 58px; height: 58px; object-fit: contain; }
      .char-card .char-name { font-weight: 700; margin-top: 0.15rem; font-size: 0.85rem; }
      .char-card .char-ability-icon { position: absolute; top: 5px; left: 7px; font-size: 0.85rem; }
      .char-card.preview { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      .char-card.taken:not(.mine) { opacity: 0.45; }
      .char-card.mine { border-color: var(--ok); }
      .char-card .char-tag {
        position: absolute; top: 4px; right: 6px; font-size: 0.66rem;
        background: var(--panel-2); border-radius: 6px; padding: 1px 5px; color: var(--muted);
      }

      /* preview panel (seleção estilo fighting game) */
      #char-preview {
        flex: 0 1 330px; min-width: 290px;
        background: var(--panel); border: 2px solid #32324e; border-radius: 16px;
        padding: 1rem 1.1rem 1.1rem;
        display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
      }
      #preview-stage {
        position: relative; width: 100%; height: 218px;
        display: flex; align-items: flex-end; justify-content: center;
        border-radius: 12px;
        background:
          radial-gradient(ellipse at 50% 68%, var(--preview-glow, rgba(255,255,255,0.08)), transparent 62%),
          linear-gradient(180deg, #171728, #1e1e33);
        overflow: hidden;
      }
      #preview-stage::after {
        content: ''; position: absolute; bottom: 14px; left: 50%;
        width: 120px; height: 20px; transform: translateX(-50%);
        background: radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 70%);
      }
      #preview-sprite {
        height: 180px; width: 180px; object-fit: contain; z-index: 1;
        margin-bottom: 18px;
        animation: preview-bob 1.6s ease-in-out infinite;
      }
      @keyframes preview-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      #preview-name { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.02em; }
      #preview-status { font-size: 0.8rem; color: var(--muted); margin-top: -0.35rem; }
      #preview-ability {
        width: 100%; background: var(--panel-2); border-radius: 10px;
        padding: 0.55rem 0.75rem; display: flex; gap: 0.6rem; align-items: center;
      }
      #preview-ability .ab-icon { font-size: 1.5rem; }
      #preview-ability .ab-name { font-weight: 700; font-size: 0.95rem; }
      #preview-ability .ab-desc { color: var(--muted); font-size: 0.78rem; line-height: 1.3; }
      #btn-pick { width: 100%; font-size: 1.02rem; }

      #lobby-bottom {
        width: min(980px, 100%);
        display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap;
        background: var(--panel); border-radius: 14px; padding: 0.85rem 1rem;
      }
      #player-list { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 0.35rem; }
      .player-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.92rem; }
      .player-row .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
      .player-row .who { color: var(--muted); font-size: 0.78rem; }
      #lobby-controls { display: flex; flex-direction: column; gap: 0.6rem; align-items: stretch; min-width: 220px; }
      #host-controls { display: flex; flex-direction: column; gap: 0.6rem; }
      #host-controls .row { display: flex; gap: 0.6rem; align-items: center; justify-content: space-between; }

      /* ----------------------------------------------------------- game */
      #screen-game { align-items: center; justify-content: center; background: #0d0d17; }
      #game-layout { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100vw; }
      #hud-top, #hud-bottom {
        display: flex; align-items: center; gap: 1rem;
        width: 100%; padding: 0.3rem 0.4rem; font-size: 0.9rem;
      }
      #hud-top { justify-content: space-between; }
      #hud-players { display: flex; gap: 0.55rem; flex-wrap: wrap; justify-content: center; }
      .hud-chip { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; }
      .hud-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
      .hud-chip.dead { opacity: 0.45; text-decoration: line-through; }
      #hud-round { font-weight: 700; }
      #hud-sudden { color: var(--muted); font-variant-numeric: tabular-nums; }
      #hud-sudden.warn { color: var(--danger); font-weight: 700; }
      canvas#game-canvas { border-radius: 10px; box-shadow: 0 0 0 2px #2c2c46, 0 18px 60px rgba(0,0,0,0.5); }
      #hud-bottom { justify-content: space-between; }
      #hud-stats { display: flex; gap: 0.9rem; font-variant-numeric: tabular-nums; }
      #hud-ability { display: flex; align-items: center; gap: 0.5rem; min-width: 220px; }
      #ability-bar { position: relative; flex: 1; height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
      #ability-fill { position: absolute; inset: 0; width: 100%; background: var(--ok); transition: width 0.1s linear; }
      #ability-bar.cooling #ability-fill { background: #5a5a86; }
      #hud-keys { color: var(--muted); font-size: 0.75rem; }

      /* -------------------------------------------------------- overlays */
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(10, 10, 20, 0.72); backdrop-filter: blur(3px); z-index: 20;
      }
      #overlay .panel {
        background: var(--panel); border: 2px solid #32324e; border-radius: 18px;
        padding: 1.6rem 2rem; min-width: min(560px, 92vw); max-height: 86vh; overflow-y: auto;
        text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      }
      #overlay h2 { margin-bottom: 0.9rem; }
      #overlay.countdown { background: transparent; backdrop-filter: none; pointer-events: none; }
      #overlay.countdown .panel { background: transparent; border: none; box-shadow: none; }
      .countdown-num {
        font-size: 7rem; font-weight: 800; color: var(--accent);
        text-shadow: 0 6px 30px rgba(255, 184, 48, 0.55); font-variant-numeric: tabular-nums;
      }
      table.score { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
      table.score th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
      table.score th, table.score td { padding: 0.42rem 0.5rem; text-align: left; border-bottom: 1px solid #2c2c46; }
      table.score td.num, table.score th.num { text-align: right; font-variant-numeric: tabular-nums; }
      table.score .delta { color: var(--ok); font-size: 0.8rem; }
      table.score tr.last-place td { background: rgba(255, 82, 82, 0.08); }
      .row-name { display: flex; align-items: center; gap: 0.45rem; }
      .row-name .dot { width: 11px; height: 11px; border-radius: 50%; }
      .medal { width: 1.4em; display: inline-block; }
      .podium-loser {
        margin-top: 1rem; padding: 0.7rem 1rem; border-radius: 12px;
        background: rgba(255, 82, 82, 0.12); border: 1px solid rgba(255, 82, 82, 0.4);
        font-weight: 600;
      }
      .overlay-sub { color: var(--muted); margin-top: 0.8rem; font-size: 0.9rem; }
      #overlay .actions { margin-top: 1.1rem; display: flex; gap: 0.7rem; justify-content: center; }

      /* ---------------------------------------------------------- toasts */
      #toasts {
        position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 0.5rem; z-index: 50; align-items: center;
      }
      .toast {
        background: var(--panel-2); border: 1px solid #454570; color: var(--text);
        border-radius: 10px; padding: 0.5rem 1rem; font-size: 0.9rem;
        animation: toast-in 0.18s ease-out; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      }
      @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }

      #dead-banner {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(28, 28, 48, 0.9); border: 1px solid #454570; border-radius: 10px;
        padding: 0.4rem 1rem; font-size: 0.9rem; z-index: 15;
      }
    </style>
  </head>
  <body>
    <div id="screen-intro" class="screen">
      <p class="intro-kicker">o ritual sagrado da retro</p>
      <h1 class="intro-title">Jogo da Retro</h1>
      <div class="intro-sub">💣 Bomber Royale</div>
      <div id="intro-roster"></div>
      <p class="intro-tagline">O último colocado organiza o jogo da próxima retro. 😈</p>
      <button id="btn-enter" class="primary">▶ Entrar</button>
      <p class="hint" id="intro-status">conectando…</p>
    </div>

    <div id="screen-lobby" class="screen" hidden>
      <header>
        <h1>💣 Bomber Royale</h1>
        <p id="lobby-status">conectando…</p>
      </header>
      <div id="lobby-main">
        <div id="char-grid"></div>
        <aside id="char-preview">
          <div id="preview-stage">
            <img id="preview-sprite" class="sprite" alt="" />
          </div>
          <div id="preview-name"></div>
          <div id="preview-status"></div>
          <div id="preview-ability">
            <span class="ab-icon"></span>
            <div>
              <div class="ab-name"></div>
              <div class="ab-desc"></div>
            </div>
          </div>
          <button id="btn-pick" class="primary"></button>
        </aside>
      </div>
      <div id="lobby-bottom">
        <div id="player-list"></div>
        <div id="lobby-controls">
          <button id="btn-ready" class="primary" disabled>Estou pronto!</button>
          <div id="host-controls" hidden>
            <div class="row">
              <label for="sel-rounds">Rodadas</label>
              <select id="sel-rounds"></select>
              <button id="btn-add-bot" title="Bot preenche a sala e joga sozinho">🤖 + bot</button>
            </div>
            <button id="btn-start" class="primary">▶ Iniciar partida</button>
          </div>
          <p class="hint" id="lobby-hint">Escolha seu personagem e marque pronto.<br />Mover: WASD/setas · Bomba: espaço · Habilidade: Shift ou E</p>
        </div>
      </div>
    </div>

    <div id="screen-game" class="screen" hidden>
      <div id="game-layout">
        <div id="hud-top">
          <span id="hud-round"></span>
          <div id="hud-players"></div>
          <span id="hud-sudden"></span>
        </div>
        <canvas id="game-canvas" width="850" height="650"></canvas>
        <div id="hud-bottom">
          <div id="hud-stats"></div>
          <div id="hud-ability">
            <span id="ability-label"></span>
            <div id="ability-bar"><div id="ability-fill"></div></div>
          </div>
          <span id="hud-keys">espaço: bomba · shift/E: habilidade</span>
        </div>
      </div>
      <div id="dead-banner" hidden></div>
    </div>

    <div id="overlay" hidden><div class="panel" id="overlay-panel"></div></div>
    <div id="toasts"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
